<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="A simple calculator frontend">
        <meta name="author" content="Nimai_HK">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <title>Calculator</title>
        <script>
        </script>
        <link rel="stylesheet" href="Styles.css">
        <link rel="icon" type="image/svg" href="logo.svg">
    </head>
    <body>
        <header id="header">
            <nav id="main-nav">
                <div id="logo">
                <img id="logo-img" src="logo.svg" width="40" height="40" alt="Sample Calculator Website"></img>
                <div id="logo-text">Basic Calculator</div>
                </div>
                <div id="links">
                    <a href="https://www.github.com/Nimai-HK" target="_blank">Author</a>
                    <a href="https://github.com/Nimai-HK/Simple-Calculator" target="_blank">Repository</a>
                </div>
            </nav>
        </header>
        <main>
            <div id="calculator-back">
                <div id="calc-display">
                </div>
                <div id="calc-buttons">
                    <button id="clr">⊗</button>
                    <button class="calc-func-sub" id="calc-pow">xʸ</button>
                    <button class="calc-func-sub" id="calc-root">ʸ√x</button>
                    <button id="del">«</button>
                    <button class="calc-func-sub" id="calc-cent">%</button>
                    <button class="calc-func-sub" id="calc-exp">e</button>
                    <button class="calc-func-sub" id="calc-log">logₓy</button>
                    <button class="calc-func" id="calc-div">÷</button>
                    <button id="num">1</button>
                    <button id="num">2</button>
                    <button id="num">3</button>
                    <button class="calc-func" id="calc-mul">×</button>
                    <button id="num">4</button>
                    <button id="num">5</button>
                    <button id="num">6</button>
                    <button class="calc-func" id="calc-diff">-</button>
                    <button id="num">7</button>
                    <button id="num">8</button>
                    <button id="num">9</button>
                    <button class="calc-func" id="calc-sum">+</button>
                    <button id="bracket">(</button>
                    <button id="num">0</button>
                    <button id="bracket">)</button>
                    <button id="solve">=</button>
                </div>
            </div>
        </main>
        <footer>
            
        </footer>
    </body>
</html>
